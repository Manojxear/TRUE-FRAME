name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Unzip project
        run: |
          unzip -q grok-workspace.zip -d app
          sed -i 's#const root = "/workspace";#const root = process.cwd();#' app/scripts/bundle-trueframe-apk.mjs
      - name: Install
        working-directory: app
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          npm install --no-audit --no-fund
      - name: Build and sign APK
        working-directory: app
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/34.0.0"
          PL="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p build/classes build/res/drawable
          node scripts/bundle-trueframe-apk.mjs build/www
          node scripts/write-launcher-icon.mjs build/res/drawable/ic_launcher.png
          javac --release 11 -classpath "$PL" -d build/classes android/app/src/main/java/com/nethamanoj/trueframe/MainActivity.java
          "$BT/d8" --lib "$PL" --output build $(find build/classes -name '*.class')
          "$BT/aapt2" compile --dir build/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PL" --manifest android/app/src/main/AndroidManifest.xml --min-sdk-version 24 --target-sdk-version 34 --version-code 1 --version-name 1.0.0 -A build/www build/res.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('build/base.apk','a');z.write('build/classes.dex','classes.dex',compress_type=zipfile.ZIP_STORED);z.close()"
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          keytool -genkeypair -keystore build/tf.keystore -storepass android -keypass android -alias trueframe -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NETHA MANOJ, O=TrueFrame, C=IN"
          "$BT/apksigner" sign --ks build/tf.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias trueframe --out TrueFrame.apk build/aligned.apk
          "$BT/apksigner" verify TrueFrame.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/TrueFrame.apk
